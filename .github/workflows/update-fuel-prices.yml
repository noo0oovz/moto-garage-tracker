name: Update fuel prices

# Companies announce each week's price change the Monday before it takes effect (DOE posts the summary that day),
# and each region's area report follows later in the week, on different days. DOE publishes weekly, so this runs
# weekly: Monday for the new price changes, then Wednesday and Friday to pick up the regional reports as they appear.
# A run where DOE has posted nothing new changes nothing and commits nothing.
on:
  schedule:
    - cron: '30 2 * * 1,3,5' # 10:30 PH time every Monday, Wednesday and Friday
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lets this job start the deploy workflow (pushes by GITHUB_TOKEN don't trigger it)

concurrency:
  group: fuel-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung download must not hold the runner for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The importer exits non-zero (and writes nothing) if no region verifies.
      - name: Import DOE prices
        run: node scripts/import-doe.mjs --out public/fuel-prices.json.new --prev public/fuel-prices.json
      - name: Validate before replacing
        run: |
          mv public/fuel-prices.json public/fuel-prices.json.bak 2>/dev/null || true
          mv public/fuel-prices.json.new public/fuel-prices.json
          if ! npm test; then
            mv public/fuel-prices.json.bak public/fuel-prices.json 2>/dev/null || true
            echo "::error::New fuel-prices.json failed validation; keeping the previous file."
            exit 1
          fi
          rm -f public/fuel-prices.json.bak
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/prices-changed.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/fuel-prices.json
            git commit -m "Update DOE fuel prices"
            # main may have moved while this job ran (e.g. a push of mine); rebase and retry instead of losing the update.
            for i in 1 2 3; do
              if git push; then break; fi
              [ "$i" = 3 ] && { echo "::error::could not push after 3 attempts"; exit 1; }
              git pull --rebase origin main
            done
            # Commits made with GITHUB_TOKEN don't fire the push trigger, so start the deploy explicitly.
            gh workflow run deploy.yml --ref main
          else
            echo "Prices unchanged (only the timestamp differs); nothing to commit."
            git checkout -- public/fuel-prices.json
          fi
